[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Find PDF links in a document, download them, and convert them to Markdown with markitdown"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "markitdown[pdf]>=0.1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[tool.setuptools]
packages = ["pdf2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# A worker thread must never take the whole run down, so the pool's result
# handling deliberately catches anything and records it as a failure.
ignore = ["BLE001"]
